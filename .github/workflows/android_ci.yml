name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'
      - 'source-danmaku'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 设置超时时间为30分钟

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 显式指定包列表：旧默认值含 'tools'，该包已从 Google 仓库移除（2026-10-10 实测）
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 单元测试门禁：纯逻辑/解析回归，不依赖网络与真机。
      # 只跑 :app：`danmaku` 模块里的 2 个上游测试用 Dispatchers.Main（Android 主线程），
      # 在 JVM 单测环境里必然 IllegalStateException，且含 8 秒真实延时；video-player /
      # download 无单测源码。2026-10-24 首次真实 CI 运行确认（run 40046369455）。
      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}

      # Build the Debug APK
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}

      # Upload APK as artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: pre-release
          path: app/build/outputs/apk/debug/*.apk