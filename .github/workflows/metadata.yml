name: Metadata Calendar

# 每天在 GitHub runner 上抓一次 Bangumi 日历，生成精简 JSON 推到 metadata 分支。
# 封面 CDN 在部分网络不可达，因此把封面缩成一小组 WebP 直接嵌进 JSON（data URI），
# App 只需要下载这一个文件，走的仍是已验证的 GitHub 直连/镜像通道。
on:
  schedule:
    - cron: '17 20 * * *' # 每日 04:17（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metadata-calendar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Fetch Bangumi calendar
        run: |
          set -euo pipefail
          UA="AnimiusTV-Metadata/1.0 (https://github.com/NEO-CC-OSS/Animius)"
          curl -fsSL --retry 3 --retry-delay 5 -A "$UA" \
            -o raw_calendar.json \
            "https://api.bgm.tv/calendar"
          echo "raw bytes: $(wc -c < raw_calendar.json)"
          echo "top-level type: $(jq -r 'type' raw_calendar.json)"
          echo "days: $(jq 'length' raw_calendar.json)"
          echo "weekday ids: $(jq -c '[.[].weekday.id]' raw_calendar.json)"
          echo "first day keys: $(jq -c '.[0] | keys' raw_calendar.json)"
          echo "first weekday: $(jq -c '.[0].weekday' raw_calendar.json)"
          echo "first item keys: $(jq -c '.[0].items[0] | keys' raw_calendar.json)"
          echo "first item sample: $(jq -c '.[0].items[0] | {id,name,name_cn,air_date,air_weekday,rank,images}' raw_calendar.json | head -c 1500)"
          # 结构校验：7 天、weekday 恰好 1..7、items 都是数组；失败即让 Action 红，避免把坏数据推出去
          jq -e 'type == "array" and length == 7' raw_calendar.json
          jq -e '[.[].weekday.id] | sort == [1,2,3,4,5,6,7]' raw_calendar.json
          jq -e 'all(.[]; (.items | type) == "array")' raw_calendar.json

      - name: Build compact JSON
        run: |
          set -euo pipefail
          updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg updated_at "$updated_at" '
            def cover:
              (.images.large // .images.common // .images.medium //
               .images.small // .images.grid // "");
            {
              schema: 1,
              updated_at: $updated_at,
              source: "https://api.bgm.tv/calendar",
              days: [
                .[] | {
                  weekday: (.weekday.id // 0),
                  weekday_cn: (.weekday.cn // ""),
                  items: [
                    (.items // [])[] | {
                      id: (.id // 0),
                      name: (.name // ""),
                      name_cn: (.name_cn // ""),
                      image: cover,
                      air_date: (.air_date // ""),
                      air_weekday: (.air_weekday // 0),
                      rank: (.rank // 0)
                    }
                  ]
                }
              ]
            }
          ' raw_calendar.json > calendar.json
          cp calendar.json calendar.urls.json
          jq -e '(.schema == 1) and (.days | length == 7)' calendar.json
          echo "compact bytes: $(wc -c < calendar.json)"
          jq -c '{updated_at, days: [.days[] | {weekday, count: (.items|length)}]}' calendar.json

      - name: Install Pillow
        run: python3 -m pip install --user --quiet pillow

      - name: Embed cover thumbnails
        run: |
          set -euo pipefail
          UA="AnimiusTV-Metadata/1.0 (https://github.com/NEO-CC-OSS/Animius)"
          mkdir -p covers
          : > covers.jsonl
          cat > resize_cover.py <<'PY'
          import sys
          from PIL import Image
          src, dst = sys.argv[1], sys.argv[2]
          img = Image.open(src).convert("RGB")
          w, h = 480, 672
          scale = max(w / img.width, h / img.height)
          img = img.resize(
              (max(1, round(img.width * scale)), max(1, round(img.height * scale))),
              Image.LANCZOS,
          )
          left = (img.width - w) // 2
          top = (img.height - h) // 2
          img = img.crop((left, top, left + w, top + h))
          img.save(dst, "WEBP", quality=70, method=6)
          PY
          ok=0
          fail=0
          consecutive_fail=0
          # 封面下载预算：最多 10 分钟或连续 10 次失败就停，剩余条目保留原 URL，
          # 保证 workflow 不会因为 CDN 不可达而拖到 30 分钟 job 超时
          deadline=$((SECONDS + 600))
          while IFS=$'\t' read -r id url; do
            if [ "$SECONDS" -ge "$deadline" ] || [ "$consecutive_fail" -ge 10 ]; then
              echo "cover fetch stopped early (elapsed=${SECONDS}s failures=$consecutive_fail)"
              break
            fi
            [ -n "$url" ] || continue
            case "$url" in
              http://*|https://*) ;;
              *) continue ;;
            esac
            src="covers/${id}.src"
            out="covers/${id}.webp"
            if curl -fsSL --retry 1 --retry-delay 1 --max-time 12 -A "$UA" -o "$src" "$url" \
               && python3 resize_cover.py "$src" "$out"; then
              b64="$(base64 -w0 "$out")"
              jq -n --arg id "$id" --arg data "data:image/webp;base64,$b64" \
                '{($id): $data}' >> covers.jsonl
              ok=$((ok+1))
              consecutive_fail=0
            else
              echo "cover failed: id=$id url=$url"
              fail=$((fail+1))
              consecutive_fail=$((consecutive_fail+1))
            fi
            rm -f "$src"
          done < <(jq -r '.days[].items[] | [.id, .image] | @tsv' calendar.json)
          echo "covers ok=$ok fail=$fail"
          if [ -s covers.jsonl ]; then
            jq -s 'add' covers.jsonl > covers.json
            jq --slurpfile covers covers.json '
              .days |= map(.items |= map(
                .image = ($covers[0][(.id|tostring)] // .image)
              ))
            ' calendar.json > calendar.with-covers.json
            mv calendar.with-covers.json calendar.json
          fi
          echo "calendar with covers bytes: $(wc -c < calendar.json)"
          echo "embedded covers: $(jq '[.days[].items[] | select(.image | startswith("data:image/"))] | length' calendar.json)"
          jq -e '(.schema == 1) and (.days | length == 7)' calendar.json

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metadata-json
          path: |
            raw_calendar.json
            calendar.urls.json
            calendar.json
          retention-days: 7

      - name: Publish calendar.json to metadata branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp calendar.json "$work/calendar.json"
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b metadata
          git add calendar.json
          git commit -q -m "metadata: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metadata
