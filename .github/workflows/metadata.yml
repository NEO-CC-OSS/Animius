name: Metadata Calendar

# 每天在 GitHub runner 上抓一次 Bangumi 日历，产出三份数据到 metadata 分支：
#   index.json        轻包（schema 2，硬上限 400 KB）：周表 7 天 + 首页三行所需字段 +
#                     相关推荐关系 + 高分推荐（纯文字），外加每张封面的相对路径
#                     covers/{id}.webp、封面内容 hash（客户端拼 ?v={hash} 做缓存失效）
#                     和 32x45 模糊占位图 lqip（WebP data URI）。
#   covers/{id}.webp  独立封面文件（480x672 WebP q70），客户端按需加载，不再内嵌 base64。
#   calendar.json     旧包（schema 1，内嵌 base64 封面），只给旧客户端与回退用。
#
# 封面增量复用：job 先 checkout 上一版 metadata 分支，内容 hash 未变的封面直接复用，
# 只有新增/变化的封面才重新下载与编码；未变化的封面不会产生新 git 对象，仓库不按天膨胀。
#
# 失败保留上一版：新产物先写 *.new.json，jq 校验通过后才 mv；任一步失败则不发布。
on:
  schedule:
    - cron: '17 20 * * *' # 每日 04:17（北京时间）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: metadata-calendar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Fetch Bangumi calendar
        run: |
          set -euo pipefail
          UA="AnimiusTV-Metadata/1.0 (https://github.com/NEO-CC-OSS/Animius)"
          curl -fsSL --retry 3 --retry-delay 5 -A "$UA" \
            -o raw_calendar.json \
            "https://api.bgm.tv/calendar"
          echo "raw bytes: $(wc -c < raw_calendar.json)"
          echo "top-level type: $(jq -r 'type' raw_calendar.json)"
          echo "days: $(jq 'length' raw_calendar.json)"
          echo "weekday ids: $(jq -c '[.[].weekday.id]' raw_calendar.json)"
          echo "first day keys: $(jq -c '.[0] | keys' raw_calendar.json)"
          echo "first weekday: $(jq -c '.[0].weekday' raw_calendar.json)"
          echo "first item keys: $(jq -c '.[0].items[0] | keys' raw_calendar.json)"
          echo "first item sample: $(jq -c '.[0].items[0] | {id,name,name_cn,air_date,air_weekday,rank,images}' raw_calendar.json | head -c 1500)"
          # 结构校验：7 天、weekday 恰好 1..7、items 都是数组；失败即让 Action 红，避免把坏数据推出去
          jq -e 'type == "array" and length == 7' raw_calendar.json
          jq -e '[.[].weekday.id] | sort == [1,2,3,4,5,6,7]' raw_calendar.json
          jq -e 'all(.[]; (.items | type) == "array")' raw_calendar.json

      - name: Build compact JSON
        run: |
          set -euo pipefail
          updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg updated_at "$updated_at" '
            def cover:
              (.images.large // .images.common // .images.medium //
               .images.small // .images.grid // "");
            {
              schema: 1,
              home_rows: 1,
              updated_at: $updated_at,
              source: "https://api.bgm.tv/calendar",
              days: [
                .[] | {
                  weekday: (.weekday.id // 0),
                  weekday_cn: (.weekday.cn // ""),
                  items: [
                    (.items // [])[] | {
                      id: (.id // 0),
                      name: (.name // ""),
                      name_cn: (.name_cn // ""),
                      image: cover,
                      air_date: (.air_date // ""),
                      air_weekday: (.air_weekday // 0),
                      rank: (.rank // 0)
                    }
                  ]
                }
              ]
            }
          ' raw_calendar.json > calendar.json
          cp calendar.json calendar.urls.json
          jq -e '(.schema == 1) and (.days | length == 7)' calendar.json
          echo "compact bytes: $(wc -c < calendar.json)"
          jq -c '{updated_at, days: [.days[] | {weekday, count: (.items|length)}]}' calendar.json

      - name: Fetch subject summaries and relations
        run: |
          set -euo pipefail
          UA="AnimiusTV-Metadata/1.0 (https://github.com/NEO-CC-OSS/Animius)"
          mkdir -p subjects relations
          ok=0
          fail=0
          rel_ok=0
          rel_fail=0
          # 切片 2：详情页需要简介/标签；切片 3：相关推荐需要 /subjects/{id}/subjects。
          # 逐条串行 + 0.3s 间隔；单条失败留空，不让整轮日历生成失败。总预算 12 分钟。
          deadline=$((SECONDS + 720))
          while read -r id; do
            [ -n "$id" ] || continue
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "subject/relation fetch stopped early (elapsed=${SECONDS}s)"
              break
            fi
            if curl -fsSL --retry 2 --retry-delay 2 --max-time 15 -A "$UA" \
                -o "subjects/${id}.json" "https://api.bgm.tv/v0/subjects/${id}" \
               && jq -e 'type == "object" and (.id // 0) > 0' "subjects/${id}.json" > /dev/null; then
              ok=$((ok+1))
            else
              echo "subject failed: id=$id"
              rm -f "subjects/${id}.json"
              fail=$((fail+1))
            fi
            if curl -fsSL --retry 2 --retry-delay 2 --max-time 15 -A "$UA" \
                -o "relations/${id}.json" "https://api.bgm.tv/v0/subjects/${id}/subjects" \
               && jq -e 'type == "array"' "relations/${id}.json" > /dev/null; then
              rel_ok=$((rel_ok+1))
            else
              echo "relation failed: id=$id"
              rm -f "relations/${id}.json"
              rel_fail=$((rel_fail+1))
            fi
            sleep 0.3
          done < <(jq -r '[.days[].items[].id] | unique[]' calendar.json)
          echo "subjects ok=$ok fail=$fail; relations ok=$rel_ok fail=$rel_fail"
          # 详情合并是增强项：任何一步失败都保留原日历继续发布，不让整轮数据变红
          if compgen -G "subjects/*.json" > /dev/null; then
            if jq -s '
              map({
                key: (.id | tostring),
                value: {
                  summary: ((.summary // "") | .[0:200]),
                  tags: [((.tags // [])[] | .name)][0:10],
                  total_episodes: (.total_episodes // 0),
                  aliases: (
                    [
                      ((.infobox // [])[]
                        | select(.key == "别名" or .key == "中文名"
                                 or .key == "英文名" or .key == "日文名")
                        | .value
                        | if type == "array"
                          then (.[] | if type == "object" then (.v // .k // empty) else . end)
                          elif type == "string" then .
                          else empty end
                      )
                    ]
                    | map(select(type == "string"))
                    | map(gsub("^[[:space:]]+|[[:space:]]+$"; ""))
                    | map(select(length > 0))
                    | unique
                    | .[0:8]
                  )
                }
              }) | from_entries
            ' subjects/*.json > subjects.json \
              && jq --slurpfile details subjects.json '
                .days |= map(.items |= map(
                  . as $item
                  | ($details[0][($item.id | tostring)] // {}) as $d
                  | $item + {
                      summary: ($d.summary // ""),
                      tags: ($d.tags // []),
                      total_episodes: ($d.total_episodes // 0),
                      aliases: ($d.aliases // [])
                    }
                ))
              ' calendar.json > calendar.with-details.json \
              && jq -e '(.schema == 1) and (.days | length == 7)' calendar.with-details.json > /dev/null; then
              mv calendar.with-details.json calendar.json
            else
              echo "subject summary merge failed; keep calendar without details"
              rm -f calendar.with-details.json
            fi
          fi
          # 相关条目只保留动画（type=2）、排除自身、按接口顺序去重；这里先留 20 个候选，
          # 等详情抓取完成、过滤 NSFW 后再在合并步骤截到 6 个。
          if compgen -G "relations/*.json" > /dev/null; then
            mkdir -p relation_agg
            : > relation_agg.jsonl
            for f in relations/*.json; do
              id="$(basename "$f" .json)"
              if jq --arg id "$id" '
                [.[] | select(.type == 2) | select((.id | tostring) != $id) | .id]
                | reduce .[] as $rid ([]; if any(.[]; . == $rid) then . else . + [$rid] end)
                | .[0:20]
                | {($id): .}
              ' "$f" > relation_agg/one.json; then
                cat relation_agg/one.json >> relation_agg.jsonl
              else
                echo "relation parse failed: $f"
              fi
            done
            jq -s 'add // {}' relation_agg.jsonl > relations.json
          else
            echo '{}' > relations.json
          fi
          echo "relations: $(jq '[.[] | length] | add // 0' relations.json) refs / $(jq 'keys | length' relations.json) subjects"
          echo "calendar with details bytes: $(wc -c < calendar.json)"
          echo "items with summary: $(jq '[.days[].items[] | select((.summary // "") != "")] | length' calendar.json)"
          echo "items with aliases: $(jq '[.days[].items[] | select((.aliases // []) | length > 0)] | length' calendar.json)"
          jq -e '(.schema == 1) and (.days | length == 7)' calendar.json

      - name: Fetch related subject details
        run: |
          set -euo pipefail
          UA="AnimiusTV-Metadata/1.0 (https://github.com/NEO-CC-OSS/Animius)"
          mkdir -p related_details
          # 只取不在本周表里的相关条目（周表条目已有详情），按被引用次数从高到低取 200 个；
          # 预算 4 分钟。这些详情用于过滤 NSFW、补简介/标签/别名，让相关推荐点进详情不是空白页。
          jq -r --slurpfile cal calendar.json '
            ([$cal[0].days[].items[].id | tostring] | unique) as $calIds
            | (reduce ([.[] | .[]][]) as $rid ({}; .[($rid | tostring)] += 1)) as $counts
            | $counts | to_entries
            | map(select(.key as $k | ($calIds | index($k)) == null))
            | sort_by(-.value)
            | .[0:200]
            | .[].key
          ' relations.json > related_ids.txt
          total=$(wc -l < related_ids.txt)
          echo "related-only ids: $total"
          ok=0
          fail=0
          deadline=$((SECONDS + 240))
          while read -r id; do
            [ -n "$id" ] || continue
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "related detail fetch stopped early (elapsed=${SECONDS}s)"
              break
            fi
            if curl -fsSL --retry 2 --retry-delay 2 --max-time 15 -A "$UA" \
                -o "related_details/${id}.json" "https://api.bgm.tv/v0/subjects/${id}" \
               && jq -e 'type == "object" and (.id // 0) > 0' "related_details/${id}.json" > /dev/null; then
              ok=$((ok+1))
            else
              echo "related detail failed: id=$id"
              rm -f "related_details/${id}.json"
              fail=$((fail+1))
            fi
            sleep 0.3
          done < related_ids.txt
          echo "related details ok=$ok fail=$fail"
          if compgen -G "related_details/*.json" > /dev/null; then
            jq -s '
              map(select(.type == 2 and (.nsfw // false) == false) | {
                key: (.id | tostring),
                value: {
                  id,
                  name: (.name // ""),
                  name_cn: (.name_cn // ""),
                  image: (.images.large // .images.common // .images.medium //
                          .images.small // .images.grid // ""),
                  summary: ((.summary // "") | .[0:200]),
                  tags: [((.tags // [])[] | .name)][0:10],
                  total_episodes: (.total_episodes // 0),
                  aliases: (
                    [
                      ((.infobox // [])[]
                        | select(.key == "别名" or .key == "中文名"
                                 or .key == "英文名" or .key == "日文名")
                        | .value
                        | if type == "array"
                          then (.[] | if type == "object" then (.v // .k // empty) else . end)
                          elif type == "string" then .
                          else empty end
                      )
                    ]
                    | map(select(type == "string"))
                    | map(gsub("^[[:space:]]+|[[:space:]]+$"; ""))
                    | map(select(length > 0))
                    | unique
                    | .[0:8]
                  )
                }
              }) | from_entries
            ' related_details/*.json > related_subjects.json
          else
            echo '{}' > related_subjects.json
          fi
          echo "related subjects: $(jq 'keys | length' related_subjects.json)"

      - name: Fetch featured subjects
        run: |
          set -euo pipefail
          UA="AnimiusTV-Metadata/1.0 (https://github.com/NEO-CC-OSS/Animius)"
          # 首页「高分推荐」：Bangumi 评分排名前 30 的动画（不含 NSFW）
          if curl -fsSL --retry 2 --retry-delay 3 --max-time 20 -A "$UA" \
              -o featured_raw.json \
              "https://api.bgm.tv/v0/subjects?type=2&sort=rank&limit=30&offset=0" \
             && jq -e '.data | type == "array"' featured_raw.json > /dev/null; then
            jq '
              [.data[]?
               | select(.type == 2 and (.nsfw // false) == false)
               | {
                   id,
                   name: (.name // ""),
                   name_cn: (.name_cn // ""),
                   image: (.images.large // .images.common // .images.medium //
                           .images.small // .images.grid // ""),
                   summary: ((.summary // "") | .[0:200]),
                   tags: [((.tags // [])[] | .name)][0:10],
                   total_episodes: (.total_episodes // 0),
                   aliases: (
                     [
                       ((.infobox // [])[]
                         | select(.key == "别名" or .key == "中文名"
                                  or .key == "英文名" or .key == "日文名")
                         | .value
                         | if type == "array"
                           then (.[] | if type == "object" then (.v // .k // empty) else . end)
                           elif type == "string" then .
                           else empty end
                       )
                     ]
                     | map(select(type == "string"))
                     | map(gsub("^[[:space:]]+|[[:space:]]+$"; ""))
                     | map(select(length > 0))
                     | unique
                     | .[0:8]
                   )
                 }
              ]
            ' featured_raw.json > featured.json
          else
            echo "featured fetch failed; keep featured empty"
            echo '[]' > featured.json
          fi
          echo "featured: $(jq 'length' featured.json)"

      - name: Merge related and featured
        run: |
          set -euo pipefail
          jq --slurpfile related relations.json \
             --slurpfile related_subjects related_subjects.json \
             --slurpfile featured featured.json '
            . as $root
            | ([ $root.days[].items[],
                 (($related_subjects[0] // {}) | .[]),
                 ($featured[0] // [])[] ]
               | map({key: (.id | tostring), value: true})
               | from_entries) as $known
            | .days |= map(.items |= map(
                . as $item
                | $item + {
                    related: [
                      (($related[0][($item.id | tostring)] // [])[] as $rid
                       | select($known[($rid | tostring)] != null)
                       | $rid)
                    ][0:6]
                  }
              ))
            | .related_subjects = ($related_subjects[0] // {})
            | .featured = ($featured[0] // [])
          ' calendar.json > calendar.with-related.json
          mv calendar.with-related.json calendar.json
          jq -e '(.schema == 1) and (.days | length == 7)' calendar.json
          echo "calendar with related/featured bytes: $(wc -c < calendar.json)"
          echo "items with related: $(jq '[.days[].items[] | select((.related // []) | length > 0)] | length' calendar.json)"

      - name: Install Pillow
        run: python3 -m pip install --user --quiet pillow

      - name: Write metadata builder
        run: |
          set -euo pipefail
          cat > build_metadata.py <<'PY'
          #!/usr/bin/env python3
          """Build lightweight metadata: covers/*.webp + index.json (+ legacy calendar.json).

          Modes
            plan  : read merged calendar.json + the previous metadata-branch manifest and print
                    the covers that still need downloading as TSV: id<TAB>group<TAB>src
            build : encode/reuse covers, then write
                      - calendar.new.json   (legacy schema 1, base64 covers embedded)
                      - index.new.json      (schema 2, light package: cover path + hash + lqip)
                      - covers/manifest.json (id -> {src, hash, ...} for the next run's reuse)

          Incremental reuse: a cover is reused when the previous manifest has the same source
          URL and the existing file's sha256 still matches the recorded hash.  Only new or
          changed covers are downloaded and re-encoded, so the metadata branch only grows by
          files whose content actually changed.

          Size budget: index.json is hard-capped (default 400,000 bytes, acceptance is
          400,000).  When the text grows (more subjects, longer summaries) the builder drops
          unreferenced / least-referenced related entries first, then featured entries, then
          shortens summaries - weekly rows are never dropped.
          """
          import argparse
          import base64
          import hashlib
          import io
          import json
          import os
          import shutil
          import sys

          from PIL import Image, ImageFilter

          WEBP_PREFIX = "data:image/webp;base64,"


          def load_json(path, default=None):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except (OSError, ValueError):
                  return default


          def dump_json(path, data):
              tmp = path + ".tmp"
              with open(tmp, "w", encoding="utf-8", newline=chr(10)) as f:
                  json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
              os.replace(tmp, path)


          def json_bytes(data):
              return len(
                  json.dumps(data, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              )


          def sha16(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()[:16]


          def cover_to_webp(src, dst, w, h, quality, blur=0.0):
              """Crop-to-fill resize (same geometry as the previous workflow) and save WebP."""
              with Image.open(src) as im:
                  img = im.convert("RGB")
              scale = max(w / img.width, h / img.height)
              img = img.resize(
                  (max(1, round(img.width * scale)), max(1, round(img.height * scale))),
                  Image.LANCZOS,
              )
              left = (img.width - w) // 2
              top = (img.height - h) // 2
              img = img.crop((left, top, left + w, top + h))
              if blur:
                  img = img.filter(ImageFilter.GaussianBlur(blur))
              img.save(dst, "WEBP", quality=quality, method=6)


          def lqip_data_uri(path, w, h, quality, blur):
              with Image.open(path) as im:
                  img = im.convert("RGB")
              scale = max(w / img.width, h / img.height)
              img = img.resize(
                  (max(1, round(img.width * scale)), max(1, round(img.height * scale))),
                  Image.LANCZOS,
              )
              left = (img.width - w) // 2
              top = (img.height - h) // 2
              img = img.crop((left, top, left + w, top + h))
              if blur:
                  img = img.filter(ImageFilter.GaussianBlur(blur))
              buf = io.BytesIO()
              img.save(buf, "WEBP", quality=quality, method=6)
              return WEBP_PREFIX + base64.b64encode(buf.getvalue()).decode("ascii")


          def b64_data_uri(path):
              with open(path, "rb") as f:
                  return WEBP_PREFIX + base64.b64encode(f.read()).decode("ascii")


          def collect_jobs(calendar):
              """Unique cover jobs in a stable order; weekly items first."""
              jobs = []
              seen = set()

              def add(item_id, src, group):
                  try:
                      key = int(item_id)
                  except (TypeError, ValueError):
                      return
                  if key in seen or not src or not isinstance(src, str):
                      return
                  if not src.startswith(("http://", "https://")):
                      return
                  seen.add(key)
                  jobs.append({"id": key, "src": src, "group": group})

              for day in calendar.get("days", []):
                  for item in day.get("items", []):
                      add(item.get("id"), item.get("image", ""), "calendar")
              for value in (calendar.get("related_subjects") or {}).values():
                  add(value.get("id"), value.get("image", ""), "extra")
              for value in calendar.get("featured") or []:
                  add(value.get("id"), value.get("image", ""), "extra")
              return jobs


          def reusable(job, prev_covers, prev_manifest):
              """Return the previous cover path when source URL and content hash both match."""
              entry = (prev_manifest.get("covers") or {}).get(str(job["id"]))
              if not entry or entry.get("src") != job["src"]:
                  return None
              path = os.path.join(prev_covers, "%s.webp" % job["id"])
              if not os.path.isfile(path):
                  return None
              if sha16(path) != entry.get("hash"):
                  return None
              return path


          def cmd_plan(args):
              calendar = load_json(args.calendar, {})
              prev_manifest = load_json(args.prev_manifest, {}) or {}
              lines = []
              reused = 0
              for job in collect_jobs(calendar):
                  if reusable(job, args.prev_covers, prev_manifest):
                      reused += 1
                  else:
                      lines.append("%s\t%s\t%s" % (job["id"], job["group"], job["src"]))
              with open(args.plan_out, "w", encoding="utf-8", newline=chr(10)) as f:
                  f.write("\n".join(lines) + ("\n" if lines else ""))
              print(
                  "covers plan: reusable=%d to_fetch=%d (previous manifest entries=%d)"
                  % (reused, len(lines), len(prev_manifest.get("covers") or {}))
              )


          def make_cover_info(jobs, covers_dir, args):
              info = {}
              for job in jobs:
                  path = os.path.join(covers_dir, "%s.webp" % job["id"])
                  if not os.path.isfile(path):
                      continue
                  info[str(job["id"])] = {
                      "cover": "covers/%s.webp" % job["id"],
                      "cover_hash": sha16(path),
                      "lqip": lqip_data_uri(
                          path, args.lqip_w, args.lqip_h, args.lqip_q, args.lqip_blur
                      ),
                  }
              return info


          def build_index(calendar, cover_info, args):
              """Light index: text fields + cover path/hash/lqip (no base64 covers)."""

              def with_cover(item, summary_cap):
                  out = dict(item)
                  out.pop("image", None)
                  summary = out.get("summary") or ""
                  if summary_cap and len(summary) > summary_cap:
                      out["summary"] = summary[:summary_cap]
                  if args.tags_cap and isinstance(out.get("tags"), list):
                      out["tags"] = out["tags"][: args.tags_cap]
                  if args.aliases_cap and isinstance(out.get("aliases"), list):
                      out["aliases"] = out["aliases"][: args.aliases_cap]
                  ci = cover_info.get(str(out.get("id")))
                  if ci:
                      out["cover"] = ci["cover"]
                      out["cover_hash"] = ci["cover_hash"]
                      out["lqip"] = ci["lqip"]
                  return out

              days = []
              for day in calendar.get("days", []):
                  days.append(
                      {
                          "weekday": day.get("weekday", 0),
                          "weekday_cn": day.get("weekday_cn", ""),
                          "items": [
                              with_cover(item, args.summary_weekly)
                              for item in day.get("items", [])
                          ],
                      }
                  )

              related = {}
              for key, value in (calendar.get("related_subjects") or {}).items():
                  entry = with_cover(value, args.summary_extra)
                  if "cover" in entry:
                      related[key] = entry

              featured = []
              for value in calendar.get("featured") or []:
                  entry = with_cover(value, args.summary_extra)
                  if "cover" in entry:
                      featured.append(entry)

              covered = {str(entry["id"]) for entry in related.values()}
              covered |= {str(entry["id"]) for entry in featured}
              for day in days:
                  for item in day["items"]:
                      if "cover" in item:
                          covered.add(str(item["id"]))
              for day in days:
                  for item in day["items"]:
                      if isinstance(item.get("related"), list):
                          item["related"] = [rid for rid in item["related"] if str(rid) in covered]

              return {
                  "schema": 2,
                  "home_rows": 1,
                  "updated_at": calendar.get("updated_at", ""),
                  "source": "https://api.bgm.tv/calendar",
                  "days": days,
                  "related_subjects": related,
                  "featured": featured,
              }


          def reference_counts(index):
              refs = {}
              for day in index.get("days", []):
                  for item in day.get("items", []):
                      for rid in item.get("related", []) or []:
                          key = str(rid)
                          refs[key] = refs.get(key, 0) + 1
              return refs


          def drop_refs(index, victim):
              for day in index.get("days", []):
                  for item in day.get("items", []):
                      if isinstance(item.get("related"), list):
                          item["related"] = [rid for rid in item["related"] if str(rid) != victim]


          def enforce_index_limit(calendar, cover_info, args):
              """Shrink the light package until it fits the hard byte budget.

              Order of sacrifice: unreferenced related entries -> least referenced related
              entries (with their refs) -> featured entries -> shorter summaries -> lqip on
              related/featured.  Weekly rows (the 7-day schedule) are never dropped.
              """
              index = build_index(calendar, cover_info, args)
              limit = args.index_limit
              size = json_bytes(index)
              if size <= limit:
                  return index, size, {}
              stats = {"orphans": 0, "related": 0, "featured": 0, "summary_cap": 0, "lqip": 0}
              while size > limit:
                  related = index.get("related_subjects") or {}
                  refs = reference_counts(index)
                  orphans = [key for key in related if key not in refs]
                  if orphans:
                      for key in orphans:
                          related.pop(key, None)
                      stats["orphans"] += len(orphans)
                      size = json_bytes(index)
                      continue
                  victims = [key for key in related if key in refs]
                  if victims:
                      victim = min(victims, key=lambda key: (refs[key], -int(key)))
                      related.pop(victim, None)
                      drop_refs(index, victim)
                      stats["related"] += 1
                      size = json_bytes(index)
                      continue
                  if index.get("featured"):
                      index["featured"].pop()
                      stats["featured"] += 1
                      size = json_bytes(index)
                      continue
                  if args.summary_weekly > 40 or args.summary_extra > 40:
                      args.summary_weekly = max(40, args.summary_weekly - 10)
                      args.summary_extra = max(40, args.summary_extra - 10)
                      stats["summary_cap"] += 1
                      index = build_index(calendar, cover_info, args)
                      size = json_bytes(index)
                      continue
                  # last resort: drop placeholders, never the schedule itself
                  dropped = False
                  for key in list((index.get("related_subjects") or {}).keys()):
                      entry = index["related_subjects"][key]
                      if "lqip" in entry:
                          entry.pop("lqip")
                          dropped = True
                          break
                  if not dropped:
                      for entry in index.get("featured") or []:
                          if "lqip" in entry:
                              entry.pop("lqip")
                              dropped = True
                              break
                  if not dropped:
                      break
                  stats["lqip"] += 1
                  size = json_bytes(index)
              return index, size, stats


          def build_legacy(calendar, covers, args):
              """Old schema-1 calendar.json with base64 covers (kept for old clients)."""

              def data_uri(item_id, kind):
                  path = os.path.join(covers, "%s.webp" % item_id)
                  if not os.path.isfile(path):
                      return None
                  if kind == "weekly":
                      return b64_data_uri(path)
                  # extras keep the old 240x336 q60 shape to preserve the legacy size budget
                  tmp = os.path.join(args.tmp_dir, "%s.legacy.webp" % item_id)
                  cover_to_webp(path, tmp, args.legacy_w, args.legacy_h, args.legacy_q, 0.0)
                  try:
                      return b64_data_uri(tmp)
                  finally:
                      try:
                          os.remove(tmp)
                      except OSError:
                          pass

              weekly_uri = {}
              extra_uri = {}
              for job in collect_jobs(calendar):
                  uri = data_uri(job["id"], "weekly" if job["group"] == "calendar" else "extra")
                  if uri:
                      target = weekly_uri if job["group"] == "calendar" else extra_uri
                      target[str(job["id"])] = uri

              def apply(item, kind):
                  out = dict(item)
                  uri = (weekly_uri if kind == "weekly" else extra_uri).get(str(out.get("id")))
                  if uri:
                      out["image"] = uri
                  return out

              days = []
              for day in calendar.get("days", []):
                  days.append(
                      {
                          "weekday": day.get("weekday", 0),
                          "weekday_cn": day.get("weekday_cn", ""),
                          "items": [apply(item, "weekly") for item in day.get("items", [])],
                      }
                  )
              related = {}
              for key, value in (calendar.get("related_subjects") or {}).items():
                  entry = apply(value, "extra")
                  if str(entry.get("image", "")).startswith("data:image/"):
                      related[key] = entry
              featured = []
              for value in calendar.get("featured") or []:
                  entry = apply(value, "extra")
                  if str(entry.get("image", "")).startswith("data:image/"):
                      featured.append(entry)

              covered = set(weekly_uri) | set(extra_uri)
              for day in days:
                  for item in day["items"]:
                      if isinstance(item.get("related"), list):
                          item["related"] = [rid for rid in item["related"] if str(rid) in covered]

              return {
                  "schema": 1,
                  "home_rows": 1,
                  "updated_at": calendar.get("updated_at", ""),
                  "source": calendar.get("source", "https://api.bgm.tv/calendar"),
                  "days": days,
                  "related_subjects": related,
                  "featured": featured,
              }


          def prune_covers(covers_dir, keep_ids):
              removed = 0
              for name in os.listdir(covers_dir):
                  if not name.endswith(".webp"):
                      continue
                  if name[:-5] not in keep_ids:
                      try:
                          os.remove(os.path.join(covers_dir, name))
                          removed += 1
                      except OSError:
                          pass
              return removed


          def cmd_build(args):
              calendar = load_json(args.calendar, {})
              prev_manifest = load_json(args.prev_manifest, {}) or {}
              os.makedirs(args.covers_dir, exist_ok=True)
              os.makedirs(args.tmp_dir, exist_ok=True)
              jobs = collect_jobs(calendar)
              manifest = {
                  "schema": 1,
                  "updated_at": calendar.get("updated_at", ""),
                  "cover_width": args.cover_w,
                  "cover_height": args.cover_h,
                  "cover_quality": args.cover_q,
                  "covers": {},
              }
              reused = new = failed = 0
              for job in jobs:
                  dst = os.path.join(args.covers_dir, "%s.webp" % job["id"])
                  prev = reusable(job, args.prev_covers, prev_manifest)
                  if prev:
                      if os.path.abspath(prev) != os.path.abspath(dst):
                          shutil.copyfile(prev, dst)
                      reused += 1
                  else:
                      raw = os.path.join(args.raw_dir, "%s.src" % job["id"])
                      if not os.path.isfile(raw) or os.path.getsize(raw) == 0:
                          failed += 1
                          continue
                      try:
                          cover_to_webp(raw, dst, args.cover_w, args.cover_h, args.cover_q, 0.0)
                          new += 1
                      except Exception as exc:  # noqa: BLE001 - one bad image must not kill the run
                          print("cover encode failed: id=%s %s" % (job["id"], exc))
                          failed += 1
                          continue
                  manifest["covers"][str(job["id"])] = {
                      "src": job["src"],
                      "hash": sha16(dst),
                      "w": args.cover_w,
                      "h": args.cover_h,
                      "q": args.cover_q,
                      "bytes": os.path.getsize(dst),
                  }

              cover_info = make_cover_info(jobs, args.covers_dir, args)
              index, index_size, trim_stats = enforce_index_limit(calendar, cover_info, args)

              # 裁剪可见化：无裁剪也写空对象，保证 index.json 始终带 trim 字段（日报/告警口径统一）
              trimmed = dict(trim_stats)
              trimmed["index_bytes"] = index_size
              trimmed["limit"] = args.index_limit
              index["trim"] = trimmed
              if json_bytes(index) > args.index_limit:
                  # 体积贴着上限时优先保证数据发布，trim 只影响可观测性
                  index.pop("trim", None)
                  print("warn: trim dropped from index.json (size limit)")

              legacy = build_legacy(calendar, args.covers_dir, args)

              dump_json(args.out_index, index)
              dump_json(args.out_calendar, legacy)
              dump_json(args.out_manifest, manifest)
              print("covers: jobs=%d reused=%d new=%d failed=%d" % (len(jobs), reused, new, failed))
              print(
                  "index bytes=%d (limit %d) legacy bytes=%d manifest entries=%d"
                  % (json_bytes(index), args.index_limit, json_bytes(legacy), len(manifest["covers"]))
              )
              if trim_stats:
                  print("index trim: %s" % json.dumps(trim_stats, sort_keys=True))
              print(
                  "index entries: weekly=%d related=%d featured=%d"
                  % (
                      sum(len(day.get("items", [])) for day in index.get("days", [])),
                      len(index.get("related_subjects") or {}),
                      len(index.get("featured") or []),
                  )
              )


          def used_cover_ids(index, legacy):
              """Cover ids still referenced by either published file."""
              used = set()
              for day in index.get("days", []):
                  for item in day.get("items", []):
                      if item.get("cover"):
                          used.add(str(item.get("id")))
              for value in (index.get("related_subjects") or {}).values():
                  if value.get("cover"):
                      used.add(str(value.get("id")))
              for value in index.get("featured") or []:
                  if value.get("cover"):
                      used.add(str(value.get("id")))
              for day in legacy.get("days", []):
                  for item in day.get("items", []):
                      if str(item.get("image", "")).startswith("data:image/"):
                          used.add(str(item.get("id")))
              for value in (legacy.get("related_subjects") or {}).values():
                  if str(value.get("image", "")).startswith("data:image/"):
                      used.add(str(value.get("id")))
              for value in legacy.get("featured") or []:
                  if str(value.get("image", "")).startswith("data:image/"):
                      used.add(str(value.get("id")))
              return used


          def cmd_prune(args):
              """Delete cover files that neither published file references any more."""
              index = load_json(args.index, {}) or {}
              legacy = load_json(args.calendar, {}) or {}
              manifest = load_json(args.manifest, {}) or {"covers": {}}
              used = used_cover_ids(index, legacy)
              removed = prune_covers(args.covers_dir, used)
              manifest["covers"] = {
                  key: value
                  for key, value in (manifest.get("covers") or {}).items()
                  if key in used
              }
              dump_json(args.manifest, manifest)
              print(
                  "covers prune: referenced=%d removed=%d manifest entries=%d"
                  % (len(used), removed, len(manifest["covers"]))
              )


          def main(argv):
              parser = argparse.ArgumentParser()
              sub = parser.add_subparsers(dest="mode", required=True)

              def common(p):
                  p.add_argument("--calendar", required=True)
                  p.add_argument("--prev-covers", required=True)
                  p.add_argument("--prev-manifest", required=True)

              prune = sub.add_parser("prune")
              prune.add_argument("--index", required=True)
              prune.add_argument("--calendar", required=True)
              prune.add_argument("--covers-dir", required=True)
              prune.add_argument("--manifest", required=True)

              plan = sub.add_parser("plan")
              common(plan)
              plan.add_argument("--plan-out", required=True)

              build = sub.add_parser("build")
              common(build)
              build.add_argument("--raw-dir", required=True)
              build.add_argument("--covers-dir", required=True)
              build.add_argument("--tmp-dir", required=True)
              build.add_argument("--out-calendar", required=True)
              build.add_argument("--out-index", required=True)
              build.add_argument("--out-manifest", required=True)
              build.add_argument("--cover-w", type=int, default=480)
              build.add_argument("--cover-h", type=int, default=672)
              build.add_argument("--cover-q", type=int, default=70)
              build.add_argument("--legacy-w", type=int, default=240)
              build.add_argument("--legacy-h", type=int, default=336)
              build.add_argument("--legacy-q", type=int, default=60)
              build.add_argument("--lqip-w", type=int, default=32)
              build.add_argument("--lqip-h", type=int, default=45)
              build.add_argument("--lqip-q", type=int, default=15)
              build.add_argument("--lqip-blur", type=float, default=1.2)
              build.add_argument("--summary-weekly", type=int, default=200)
              build.add_argument("--summary-extra", type=int, default=200)
              build.add_argument("--tags-cap", type=int, default=10)
              build.add_argument("--aliases-cap", type=int, default=8)
              build.add_argument("--index-limit", type=int, default=400000)

              args = parser.parse_args(argv)
              if args.mode == "plan":
                  cmd_plan(args)
              elif args.mode == "prune":
                  cmd_prune(args)
              else:
                  cmd_build(args)


          if __name__ == "__main__":
              main(sys.argv[1:])
          PY
          python3 -m py_compile build_metadata.py
          echo "builder: $(wc -l < build_metadata.py) lines"

      - name: Restore previous metadata branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf prev prev_clone
          if git clone --depth 1 --single-branch --branch metadata \
               "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
               prev_clone > clone.log 2>&1; then
            mv prev_clone prev
            echo "restored previous metadata branch: $(du -sh prev | cut -f1)"
            echo "previous covers: $(find prev/covers -maxdepth 1 -name '*.webp' 2>/dev/null | wc -l)"
            if [ -f prev/index.json ]; then
              echo "previous index.json bytes: $(wc -c < prev/index.json)"
            else
              echo "previous index.json bytes: 0 (old layout)"
            fi
            if [ -f prev/calendar.json ]; then
              echo "previous calendar.json bytes: $(wc -c < prev/calendar.json)"
            else
              echo "previous calendar.json bytes: 0"
            fi
          else
            echo "no previous metadata branch (first run); starting with an empty cover cache"
            sed -e 's/x-access-token:[^@]*@/x-access-token:***@/g' clone.log | tail -3 || true
            rm -rf prev_clone
            mkdir -p prev/covers
            cd prev
            git init -q
            git checkout -q -b metadata
            cd ..
          fi
          rm -f clone.log

      - name: Plan cover downloads
        run: |
          set -euo pipefail
          python3 build_metadata.py plan \
            --calendar calendar.json \
            --prev-covers prev/covers \
            --prev-manifest prev/covers/manifest.json \
            --plan-out cover_plan.tsv
          awk -F'\t' '$2 == "calendar"' cover_plan.tsv > cover_calendar.tsv
          awk -F'\t' '$2 == "extra"' cover_plan.tsv > cover_extra.tsv
          echo "cover jobs: calendar=$(wc -l < cover_calendar.tsv) extra=$(wc -l < cover_extra.tsv)"

      - name: Fetch changed covers
        run: |
          set -euo pipefail
          UA="AnimiusTV-Metadata/1.0 (https://github.com/NEO-CC-OSS/Animius)"
          mkdir -p raw_covers
          ok=0
          fail=0
          # 只下载新增或内容变化的封面（复用判定已在 plan 步骤完成）。
          # 两组独立预算，避免周表封面慢时把相关/高分封面饿死。
          fetch_covers() {
            local jobs="$1"
            local budget="$2"
            local deadline=$((SECONDS + budget))
            local consecutive=0
            local id group url
            while IFS=$'\t' read -r id group url; do
              [ -n "$id" ] || continue
              [ -n "$url" ] || continue
              if [ "$SECONDS" -ge "$deadline" ] || [ "$consecutive" -ge 10 ]; then
                echo "cover fetch stopped early: $jobs (elapsed=${SECONDS}s consecutive_failures=$consecutive)"
                break
              fi
              case "$url" in
                http://*|https://*) ;;
                *) continue ;;
              esac
              if curl -fsSL --retry 1 --retry-delay 1 --max-time 15 -A "$UA" \
                   -o "raw_covers/${id}.src" "$url"; then
                ok=$((ok + 1))
                consecutive=0
              else
                echo "cover download failed: id=$id"
                rm -f "raw_covers/${id}.src"
                fail=$((fail + 1))
                consecutive=$((consecutive + 1))
              fi
            done < "$jobs"
          }
          fetch_covers cover_calendar.tsv 600
          fetch_covers cover_extra.tsv 600
          echo "downloaded ok=$ok fail=$fail"

      - name: Build index.json and covers
        run: |
          set -euo pipefail
          mkdir -p covers tmp
          python3 build_metadata.py build \
            --calendar calendar.json \
            --prev-covers prev/covers \
            --prev-manifest prev/covers/manifest.json \
            --raw-dir raw_covers \
            --covers-dir covers \
            --tmp-dir tmp \
            --out-calendar calendar.new.json \
            --out-index index.new.json \
            --out-manifest covers/manifest.json \
            --lqip-w 32 --lqip-h 45 --lqip-q 15 --lqip-blur 1.2 \
            --summary-weekly 200 --summary-extra 200 \
            --tags-cap 10 --aliases-cap 8 \
            --index-limit 400000

      - name: Build sources.json
        run: |
          set -uo pipefail
          # 源域名清单是**增强项**：解析失败绝不能阻断元数据发布（红线：任一步失败都要保留原日历继续发布）。
          # 从 App 源码的 CANDIDATE_DOMAINS 解析，保持「App 是唯一事实来源」。
          # 客户端只在「内置候选域名全失败」时才按需拉取（见 docs/tasks/adhoc/02-P0数据自维护.md）。
          python3 - <<'PY' || echo "::warning::sources.json 解析脚本异常，走沿用上一版逻辑"
          import datetime
          import json
          import os
          import re

          BASE = "app/src/main/java/com/lanlinju/animius/data/remote/parse"
          FILES = {"Lz": "LzSource.kt", "Bf": "BfSource.kt", "Md": "MdSource.kt"}
          sources = {}
          for tag, name in FILES.items():
              path = os.path.join(BASE, name)
              if not os.path.isfile(path):
                  print("warn: missing %s" % path)
                  continue
              text = open(path, encoding="utf-8").read()
              anchor = text.find("CANDIDATE_DOMAINS")
              if anchor < 0:
                  print("warn: CANDIDATE_DOMAINS not found in %s" % path)
                  continue
              # 只取定义处附近的窗口并跳过整行注释：避免注释里的 ASCII ')' 把正则截断
              window = text[anchor:anchor + 800]
              body = "\n".join(
                  line for line in window.splitlines()
                  if not line.strip().startswith("//")
              )
              domains = [d.strip() for d in re.findall(r'"(https://[^"]+)"', body)]
              if not domains:
                  print("warn: no https domain in %s" % path)
                  continue
              sources[tag] = {"domains": domains}

          if not sources:
              raise SystemExit("no sources parsed from App source")

          payload = {
              "schema": 1,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "sources": sources,
          }
          with open("sources.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(payload, f, ensure_ascii=False, indent=1)
              f.write("\n")
          print("sources.json:", json.dumps(sources, ensure_ascii=False))
          PY
          # 尽力而为：解析不到就沿用上一版；校验失败只警告，绝不让元数据断更
          if [ ! -f sources.json ]; then
            if [ -f prev/sources.json ]; then
              cp -f prev/sources.json sources.json
              echo "::warning::sources.json 解析失败，沿用上一版"
            else
              echo "::warning::没有 sources.json（首轮或解析失败），本次不发布该文件"
            fi
          fi
          if [ -f sources.json ]; then
            jq -e '.schema == 1' sources.json > /dev/null \
              || echo "::warning::sources.json schema 校验失败，仍发布（客户端会丢弃并回退内置域名）"
            echo "sources.json bytes: $(wc -c < sources.json)"
          fi

      - name: Validate new artifacts
        run: |
          set -euo pipefail
          # 结构：schema 2、7 天、周表有条目
          jq -e '(.schema == 2) and (.days | length == 7) and ([.days[].items[]] | length > 0)' index.new.json > /dev/null
          # 每个带封面的条目必须同时有内容 hash 与 lqip
          jq -e '([.days[].items[], (.related_subjects | .[]), (.featured | .[])]
                 | map(select(has("cover")))
                 | all(has("cover_hash") and has("lqip")))' index.new.json > /dev/null
          # lqip 必须是 WebP data URI
          jq -e '([.days[].items[], (.related_subjects | .[]), (.featured | .[])]
                 | map(select(has("lqip")))
                 | all(.lqip | startswith("data:image/webp;base64,")))' index.new.json > /dev/null
          # 轻包体积硬上限（验收 ≤400,000 bytes；构建器已按 400,000 自裁剪）
          index_size="$(wc -c < index.new.json)"
          echo "index.json bytes: ${index_size} (hard limit 400000)"
          test "$index_size" -le 400000
          # 每个封面引用都要有对应文件
          jq -r '[.days[].items[], (.related_subjects | .[]), (.featured | .[])]
                 | .[] | select(has("cover")) | .cover' index.new.json | sort -u > cover_refs.txt
          missing=0
          while read -r rel; do
            [ -n "$rel" ] || continue
            if [ ! -f "$rel" ]; then
              echo "missing cover file: $rel"
              missing=$((missing + 1))
            fi
          done < cover_refs.txt
          test "$missing" -eq 0
          echo "cover refs: $(wc -l < cover_refs.txt), missing: $missing"
          # 网络整体失败时不要把上一版（有封面）的轻包覆盖掉：周表封面数骤降即中止
          new_weekly_covers="$(jq '[.days[].items[] | select(has("cover"))] | length' index.new.json)"
          prev_weekly_covers=0
          if [ -f prev/index.json ]; then
            prev_weekly_covers="$(jq '[.days[].items[] | select(has("cover"))] | length' prev/index.json 2>/dev/null || echo 0)"
          fi
          echo "weekly covers: new=${new_weekly_covers} previous=${prev_weekly_covers}"
          if [ "$prev_weekly_covers" -ge 50 ]; then
            threshold=$((prev_weekly_covers * 8 / 10))
            test "$new_weekly_covers" -ge "$threshold"
          fi
          # 旧包结构不变
          jq -e '(.schema == 1) and (.days | length == 7)' calendar.new.json > /dev/null
          echo "legacy calendar.json bytes: $(wc -c < calendar.new.json)"
          # 校验通过才安装
          mv index.new.json index.json
          mv calendar.new.json calendar.json
          echo "installed: index.json=$(wc -c < index.json) calendar.json=$(wc -c < calendar.json) covers=$(find covers -maxdepth 1 -name '*.webp' | wc -l)"

      - name: Check trim budget
        id: trim
        if: always()
        run: |
          set -uo pipefail
          # 裁剪不阻断发布（数据仍可用），只作为告警信号：丢推荐 >10 条或压缩过简介就提醒。
          over=0
          if [ -f index.json ]; then
            lost=$(jq '(.trim // {}) | ((.orphans // 0) + (.related // 0) + (.featured // 0))' index.json 2>/dev/null || echo 0)
            caps=$(jq '(.trim // {}) | (.summary_cap // 0)' index.json 2>/dev/null || echo 0)
            echo "trim: lost=${lost} summary_cap=${caps}"
            if [ "${lost}" -gt 10 ] || [ "${caps}" -gt 0 ]; then
              over=1
              echo "::warning::元数据发生裁剪（丢失 ${lost} 条推荐 / 压缩 ${caps} 轮简介），数据仍会发布"
            fi
          else
            echo "no index.json（前面步骤失败）"
          fi
          echo "over=${over}" >> "$GITHUB_OUTPUT"

      - name: Trim legacy calendar.json to size budget
        run: |
          set -euo pipefail
          cat > trim_metadata.py <<'PY'
          import json
          import sys

          path = sys.argv[1]
          limit = int(sys.argv[2])

          with open(path, encoding="utf-8") as f:
              data = json.load(f)


          def encoded_size():
              return len(
                  json.dumps(data, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              )


          def references():
              refs = {}
              for day in data.get("days", []):
                  for item in day.get("items", []):
                      for rid in item.get("related", []):
                          key = str(rid)
                          refs[key] = refs.get(key, 0) + 1
              return refs


          # 体积超限时从「仅相关条目」开始丢，周表 7 天数据绝不裁剪
          while encoded_size() > limit:
              refs = references()
              related = data.get("related_subjects", {})
              orphans = [key for key in related if key not in refs]
              if orphans:
                  for key in orphans:
                      related.pop(key, None)
                  continue
              if refs:
                  victims = [key for key in refs if key in related]
                  if victims:
                      victim = min(victims, key=lambda key: (refs[key], -int(key)))
                      related.pop(victim, None)
                      for day in data.get("days", []):
                          for item in day.get("items", []):
                              item["related"] = [
                                  rid for rid in item.get("related", []) if str(rid) != victim
                              ]
                      continue
              if data.get("featured"):
                  data["featured"].pop()
                  continue
              break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))

          print(f"final bytes: {encoded_size()} (limit {limit})")
          PY
          python3 trim_metadata.py calendar.json 9000000
          jq -e '(.schema == 1) and (.days | length == 7)' calendar.json
          echo "related subjects: $(jq '.related_subjects | length' calendar.json)"
          echo "featured: $(jq '.featured | length' calendar.json)"

      - name: Prune unreferenced covers
        run: |
          set -euo pipefail
          python3 build_metadata.py prune \
            --index index.json \
            --calendar calendar.json \
            --covers-dir covers \
            --manifest covers/manifest.json
          echo "covers kept: $(find covers -maxdepth 1 -name '*.webp' | wc -l), total: $(du -sh covers | cut -f1)"

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metadata-json
          path: |
            raw_calendar.json
            calendar.urls.json
            calendar.json
            index.json
            sources.json
            relations.json
            related_subjects.json
            featured.json
            covers/manifest.json
          retention-days: 7

      - name: Publish metadata branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd prev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 旧包 calendar.json 已下线（2026-10-22）：不再发布，并清掉分支上的残留。
          # 客户端仍有本地旧缓存兜底；metadata 分支只保留 index.json + covers。
          rm -f calendar.json
          cp -f ../index.json index.json
          if [ -f ../sources.json ]; then cp -f ../sources.json sources.json; fi
          mkdir -p covers
          if [ -n "$(find ../covers -maxdepth 1 -name '*.webp' -print -quit)" ]; then
            cp -f ../covers/*.webp covers/
          fi
          cp -f ../covers/manifest.json covers/manifest.json
          # 删掉不再被引用的旧封面，避免仓库无限增长（增量复用只针对仍在用的封面）
          for f in covers/*.webp; do
            [ -e "$f" ] || continue
            if [ ! -f "../covers/$(basename "$f")" ]; then
              rm -f "$f"
            fi
          done
          git add -A
          changed="$(git diff --cached --name-only | wc -l)"
          cover_changed="$(git diff --cached --name-only -- 'covers/*.webp' | wc -l)"
          cover_added="$(git diff --cached --name-status -- 'covers/*.webp' | awk '$1 == "A"' | wc -l)"
          cover_removed="$(git diff --cached --name-status -- 'covers/*.webp' | awk '$1 == "D"' | wc -l)"
          echo "changed files: ${changed} (covers changed: ${cover_changed}, added: ${cover_added}, removed: ${cover_removed})"
          if [ "$changed" -eq 0 ]; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -q -m "metadata: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metadata

      - name: Publish health summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## metadata 生成结果"
            echo ""
            if [ -f index.json ]; then
              echo "- index.json：$(wc -c < index.json) bytes（上限 400000）"
              echo "- trim：\`$(jq -c '.trim // {}' index.json)\`"
              echo "- 周表条目：$(jq '[.days[].items[]] | length' index.json)"
              echo "- 相关推荐：$(jq '.related_subjects | length' index.json) / 高分推荐：$(jq '.featured | length' index.json)"
              echo "- sources.json：$(jq -c '.sources' sources.json 2>/dev/null || echo '缺失')"
            else
              echo "- 未产出 index.json（本轮失败或提前退出）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on failure or heavy trim
        if: failure() || steps.trim.outputs.over == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIM_OVER: ${{ steps.trim.outputs.over }}
        run: |
          set -uo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "${TRIM_OVER:-0}" = "1" ]; then
            title="metadata 裁剪告警：$(date -u +%F)"
            body=$(printf '本轮元数据发生**裁剪**（体积超预算），**数据已正常发布**，但部分推荐/简介被丢弃。\n\n- 运行记录：%s\n- 处理：看 `index.json` 的 `trim` 字段；要么调大 `--index-limit`，要么缩减条目。\n- 说明：这是告警不是故障，客户端不受影响。\n' "$run_url")
          else
            title="metadata 生成失败：$(date -u +%F)"
            body=$(printf '本次定时任务失败，**没有发布新数据**（客户端继续用上一版）。\n\n- 运行记录：%s\n- 常见原因：Bangumi 接口异常 / 封面下载失败 / 体积或结构校验不通过。\n- 处理：看该次运行日志定位；数据不会变坏，只是停更。\n' "$run_url")
          fi
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || true
          else
            gh issue create --title "$title" --body "$body" || true
          fi
